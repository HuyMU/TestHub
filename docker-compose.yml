version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: testhub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-testhub_db}
      MYSQL_USER: ${DB_USER:-testhub_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-testhub_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testhub-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-testhub_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-testhub_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-testhub_pass}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SEED_LEADER_USERNAME: ${SEED_LEADER_USERNAME:-leader}
      SEED_LEADER_EMAIL: ${SEED_LEADER_EMAIL:-leader@testhub.com}
      SEED_LEADER_PASSWORD: ${SEED_LEADER_PASSWORD:-Leader@123456}
      UPLOAD_DIR: /uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/uploads

volumes:
  mysql_data:
  uploads_data:
